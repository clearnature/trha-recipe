[package]
name = "trha-recipe-ffi"
version.workspace = true
edition.workspace = true
description = "C ABI FFI bridge for deepseek-recipe: JSON-in/JSON-out for Haskell FFI integration."
license.workspace = true

[lib]
name = "trha_recipe_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
deepseek-recipe = { workspace = true }
deepseek-recipe-core = { workspace = true }
deepseek-recipe-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
# 不走 workspace 继承：workspace 根的声明隐含 default features（OpenCV），
# 而本机无 OpenCV——server-rs 同样直接声明，是既有先例。
deepseek-recipe-image = { version = "0.2.0", path = "../deepseek-recipe-image", default-features = false, features = ["reqwest-fetch"] }
image = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokenizers = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
